name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  integration-smoke:
    name: Herdr smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # The smoke job owns the runner, so the headless server is the only
      # session present. The first CLI call starts that server — no
      # interactive client is ever needed.
      HERDR_ENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      - name: Install Herdr (Linux/macOS)
        if: runner.os != 'Windows'
        run: curl -fsSL https://herdr.dev/install.sh | sh

      - name: Install Herdr (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          powershell -ExecutionPolicy Bypass -c
          "irm https://herdr.dev/install.ps1 | iex"

      - name: Put Herdr and the local pi binary on PATH
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(command -v herdr || true)"
          if [ -z "$BIN" ]; then
            BIN="$(find "$HOME/.herdr" -type f -name 'herdr*' \
              -perm -u+x 2>/dev/null | head -1)"
          fi
          if [ -z "$BIN" ]; then
            echo "herdr binary not found after install" >&2
            exit 1
          fi
          echo "herdr: $BIN"
          echo "$(dirname "$BIN")" >> "$GITHUB_PATH"
          # The lifecycle spawn test launches `pi` inside a pane.
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Start the headless server and resolve a pane
        shell: bash
        run: |
          set -euo pipefail
          herdr pane list > /dev/null
          PANE="$(herdr pane list | node scripts/ci-pick-pane.mjs)"
          echo "HERDR_PANE_ID=$PANE" >> "$GITHUB_ENV"
          echo "smoke pane: $PANE"

      - name: Integration suites
        run: npm run test:integration

      - name: Stop the headless server
        if: always()
        shell: bash
        run: herdr server stop || true
